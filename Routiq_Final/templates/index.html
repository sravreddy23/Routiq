<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Routiq — Smart Route Planner</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="15" stroke="#38bdf8" stroke-width="2"/>
          <circle cx="8" cy="22" r="3" fill="#38bdf8"/>
          <circle cx="24" cy="10" r="3" fill="#ef4444"/>
          <path d="M8 22 Q14 8 24 10" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="3 2"/>
        </svg>
        <span class="brand-name">Routiq</span>
      </div>
      <p class="brand-tagline">Greedy Best-First Search · Indian City Network</p>
    </div>
  </header>

  <main class="container">
    <div class="card controls-card">
      <div class="controls">
        <div class="field">
          <label for="source">Source</label>
          <select id="source"></select>
        </div>
        <div class="arrow-sep">→</div>
        <div class="field">
          <label for="destination">Destination</label>
          <select id="destination"></select>
        </div>
        <div class="field zoom-field">
          <label for="zoom">Zoom <span id="zoomVal">1.6×</span></label>
          <input id="zoom" type="range" min="0.5" max="4" step="0.1" value="1.6">
        </div>
        <div class="btn-group">
          <button id="find" class="btn btn-primary">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
            Find Route
          </button>
          <button id="reset" class="btn btn-secondary">Reset</button>
        </div>
      </div>
    </div>

    <div class="main-layout">
      <div class="card visual-card">
        <div class="visual-header">
          <span class="visual-label">Graph Visualization</span>
          <span id="statusBadge" class="badge badge-idle">Idle</span>
        </div>
        <canvas id="graphCanvas"></canvas>
        <div class="legend">
          <span class="legend-item"><span class="dot dot-node"></span>City</span>
          <span class="legend-item"><span class="dot dot-visited"></span>Visited</span>
          <span class="legend-item"><span class="dot dot-path"></span>Route</span>
          <span class="legend-item"><span class="dot dot-current"></span>Current</span>
        </div>
      </div>

      <div class="sidebar">
        <div class="card result-card" id="resultCard">
          <div class="result-placeholder" id="resultPlaceholder">
            <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="#334155" stroke-width="2"/><path d="M16 28 Q24 16 32 20" stroke="#334155" stroke-width="2" fill="none"/><circle cx="16" cy="28" r="2.5" fill="#334155"/><circle cx="32" cy="20" r="2.5" fill="#334155"/></svg>
            <p>Select a source &amp; destination<br>and click <strong>Find Route</strong></p>
          </div>
          <div class="result-content" id="resultContent" style="display:none">
            <div class="result-section">
              <h3 class="result-title">Route Found</h3>
              <div class="stat-row">
                <div class="stat">
                  <span class="stat-label">Total Distance</span>
                  <span class="stat-value" id="statCost">—</span>
                </div>
                <div class="stat">
                  <span class="stat-label">Stops</span>
                  <span class="stat-value" id="statStops">—</span>
                </div>
                <div class="stat">
                  <span class="stat-label">Nodes Visited</span>
                  <span class="stat-value" id="statVisited">—</span>
                </div>
              </div>
            </div>
            <div class="result-section">
              <h4 class="section-label">Path</h4>
              <div id="pathList" class="path-list"></div>
            </div>
          </div>
        </div>

        <div class="card step-card" id="stepCard" style="display:none">
          <h4 class="section-label">Traversal Steps</h4>
          <div id="traversalList" class="traversal-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
